<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1e3a8a" />
<title>تسجيل الدخول — إدارة الحسابات والتقارير</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .login-msg { min-height:20px; margin-top:14px; font-size:13.5px; font-weight:700; text-align:center; }
  .login-msg.err { color:var(--danger); }
  .login-msg.ok { color:var(--success); }
  .org-code-box { display:flex; gap:6px; }
  .login-logo-card {
    width: 106px;
    height: 106px;
    margin: 0 auto 16px;
    background: #ffffff;
    border-radius: 24px;
    padding: 6px;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.16), 0 2px 8px rgba(0, 0, 0, 0.04);
    border: 2px solid #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  .login-logo-card img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <div style="text-align:center">
      <div class="login-logo-card">
        <img id="loginTopLogo" class="login-logo" src="Image/app_logo.jpg" alt="شعار النظام" title="انقر 3 مرات لضبط السيرفر" style="cursor:pointer" />
      </div>
    </div>
    <h1 id="loginMainTitle">إدارة الحسابات</h1>
    <p class="sub" id="loginSubTitle">منظومة إدارة الحسابات والتقارير المالية والميدانية</p>

    <form id="loginForm" class="form-grid">
      <div class="field full">
        <span>رمز الجهة / المنظمة (Organization Code)</span>
        <div class="org-code-box">
          <input type="text" id="orgCode" placeholder="مثال: DEMO أو AMAL..." style="text-transform:uppercase;font-weight:800;letter-spacing:1px" autocomplete="off" />
          <button type="button" class="btn btn-outline" id="btnCheckOrg" style="padding:0 12px;font-size:13px;font-weight:700;white-space:nowrap" title="التحقق من الجهة">فحص 🔍</button>
          <button type="button" class="btn btn-outline" id="btnScanQr" style="padding:0 12px;font-size:13px;font-weight:700;white-space:nowrap" title="مسح باركود المؤسسة">📷 باركود</button>
        </div>
        <div id="orgStatusText" style="font-size:12px;font-weight:700;color:var(--primary);margin-top:2px;display:none"></div>
      </div>

      <div class="field full">
        <span>اسم المستخدم</span>
        <input type="text" id="userName" required autocomplete="username" placeholder="أدخل اسم المستخدم..." />
      </div>

      <div class="field full">
        <span>كلمة المرور</span>
        <div style="display:flex;gap:6px;position:relative">
          <input type="password" id="password" required autocomplete="current-password" placeholder="أدخل كلمة المرور..." style="flex:1" />
          <button type="button" class="btn btn-outline" id="toggleLoginPasswordBtn" style="padding:0 12px;font-size:16px" title="إظهار / إخفاء كلمة المرور">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary full" id="loginBtn" style="margin-top:8px;font-size:15px;padding:12px">تسجيل الدخول</button>
    </form>

    <div id="loginMessage" class="login-msg"></div>

    <!-- زر فحص الاتصال المباشر بالسيرفر بدون إظهار أي روابط -->
    <div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:14px">
      <button type="button" class="btn btn-outline full" id="btnTestServerConn" style="font-size:13px;padding:9px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px">
        <span>📶</span>
        <span>فحص حالة الاتصال بالسيرفر</span>
      </button>
      <div id="connStatusBox" style="display:none;margin-top:10px;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:800;text-align:center"></div>
    </div>

    <div style="text-align:center;margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
      <div style="font-size:12px;color:var(--muted)">
        منظومة إدارة الحسابات والتقارير الميدانية © 2026
      </div>
    </div>
  </div>
</main>

<script src="js/config.js?v=20260922-102"></script>
<script src="js/app.js?v=20260922-102"></script>
<script src="js/login.js?v=20260922-102"></script>
</body>
</html>
